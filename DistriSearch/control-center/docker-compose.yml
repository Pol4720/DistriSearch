version: '3.8'

services:
  control-center-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: control-center-backend
    ports:
      - "8888:8888"
    environment:
      - DISTRISEARCH_URL=http://distrisearch-master:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-center-net
      - docker_distrisearch-network
    restart: unless-stopped

  control-center-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: control-center-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://control-center-backend:8888
    depends_on:
      - control-center-backend
    networks:
      - control-center-net
    restart: unless-stopped

networks:
  control-center-net:
    driver: bridge
  docker_distrisearch-network:
    external: true
