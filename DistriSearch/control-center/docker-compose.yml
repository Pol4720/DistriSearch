# ═══════════════════════════════════════════════════════════════════════════
# Docker Compose for Control Center
# Monitoreo y gestión del sistema distribuido DistriSearch
# ═══════════════════════════════════════════════════════════════════════════

version: "3.8"

networks:
  distrisearch-network:
    external: true

services:
  # ═══════════════════════════════════════════════════════════════════════
  # CONTROL CENTER BACKEND (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════
  control-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: control-center-backend
    environment:
      - DISTRISEARCH_URL=http://master:8001
      - MASTER_HOST=master
      - MASTER_PORT=8001
    ports:
      - "8888:8888"
    networks:
      - distrisearch-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # CONTROL CENTER FRONTEND (Streamlit)
  # ═══════════════════════════════════════════════════════════════════════
  control-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: control-center-frontend
    environment:
      - BACKEND_URL=http://control-backend:8888
    ports:
      - "8501:8501"
    networks:
      - distrisearch-network
    depends_on:
      - control-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
