version: '3.8'

networks:
  distrisearch-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - MONGO_INITDB_DATABASE=distrisearch
    ports:
      - "27017:27017"
    networks:
      - distrisearch-network
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Replica Set Init
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - distrisearch-network
    command: >
      mongosh --host mongodb:27017 --eval '
        rs.initiate({
          _id: "rs0",
          members: [{ _id: 0, host: "mongodb:27017" }]
        })
      '
    restart: "no"

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - distrisearch-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single Slave Node
  slave-1:
    build:
      context: ..
      dockerfile: docker/slave/Dockerfile
    environment:
      - NODE_ID=slave-1
      - NODE_ROLE=slave
      - MASTER_HOST=slave-1
      - MASTER_PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/distrisearch?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "8080:80"
      - "8443:443"
      - "8000:8000"
    networks:
      - distrisearch-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
