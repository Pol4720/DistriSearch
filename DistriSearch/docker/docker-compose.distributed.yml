# ═══════════════════════════════════════════════════════════════════════════
# Docker Compose for AP Mode (Available & Partition-tolerant)
# ═══════════════════════════════════════════════════════════════════════════
#
# Arquitectura AP:
# - SQLite (Raft-replicado): usuarios, nodos, particiones
# - MongoDB LOCAL por nodo: documentos
# - Redis LOCAL por nodo: caché
#
# Cada slave tiene su propia instancia de MongoDB y Redis
# Esto garantiza disponibilidad durante particiones de red
#
# ═══════════════════════════════════════════════════════════════════════════

networks:
  distrisearch-ap:
    driver: bridge

volumes:
  # Master data
  master-sqlite:
  master-raft:
  master-mongodb:
  master-redis:
  # Slave 1 data
  slave1-sqlite:
  slave1-raft:
  slave1-mongodb:
  slave1-redis:
  slave1-docs:
  # Slave 2 data
  slave2-sqlite:
  slave2-raft:
  slave2-mongodb:
  slave2-redis:
  slave2-docs:

services:
  # ═══════════════════════════════════════════════════════════════════════
  # MASTER NODE
  # ═══════════════════════════════════════════════════════════════════════
  
  # Master's local MongoDB
  master-mongodb:
    image: mongo:7.0
    command: mongod --bind_ip_all
    volumes:
      - master-mongodb:/data/db
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Master's local Redis
  master-redis:
    image: redis:7-alpine
    volumes:
      - master-redis:/data
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Master node
  master:
    build:
      context: ..
      dockerfile: docker/master/Dockerfile
    environment:
      # Node identity
      - NODE_ID=master-1
      - NODE_ROLE=master
      - CLUSTER_ID=distrisearch-ap-cluster
      # AP Mode
      # Local MongoDB (for master's documents)
      - LOCAL_MONGODB_URI=mongodb://master-mongodb:27017
      - MONGODB_URI=mongodb://master-mongodb:27017/distrisearch_master
      # Local Redis
      - REDIS_URL=redis://master-redis:6379
      # Raft peers
      - RAFT_PEERS=master-1,slave-1,slave-2
      # API
      - API_PORT=8001
      - NODE_ADDRESS=master
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - master-sqlite:/app/data/sqlite
      - master-raft:/app/data/raft
    ports:
      - "8001:8001"
    networks:
      - distrisearch-ap
    depends_on:
      - master-mongodb
      - master-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # SLAVE 1 NODE (with its own MongoDB and Redis)
  # ═══════════════════════════════════════════════════════════════════════
  
  # Slave 1's local MongoDB
  slave1-mongodb:
    image: mongo:7.0
    command: mongod --bind_ip_all
    volumes:
      - slave1-mongodb:/data/db
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Slave 1's local Redis
  slave1-redis:
    image: redis:7-alpine
    volumes:
      - slave1-redis:/data
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Slave 1 node
  slave-1:
    image: distrisearch/slave:latest
    environment:
      # Node identity
      - NODE_ID=slave-1
      - NODE_ROLE=slave
      - CLUSTER_ID=distrisearch-ap-cluster
      # AP Mode
      # Local MongoDB (THIS node's documents)
      - LOCAL_MONGODB_URI=mongodb://slave1-mongodb:27017
      - MONGODB_URI=mongodb://slave1-mongodb:27017/distrisearch_slave1
      # Local Redis
      - REDIS_URL=redis://slave1-redis:6379
      # Master connection
      - MASTER_HOST=master
      - MASTER_PORT=8001
      # Raft peers
      - RAFT_PEERS=master-1,slave-1,slave-2
      # API
      - API_PORT=8000
      - NODE_ADDRESS=slave-1
      # Replication
      - REPLICATION_FACTOR=2
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - slave1-sqlite:/app/data/sqlite
      - slave1-raft:/app/data/raft
      - slave1-docs:/app/data/documents
    ports:
      - "8080:80"
      - "8000:8000"
    networks:
      - distrisearch-ap
    depends_on:
      - master
      - slave1-mongodb
      - slave1-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # SLAVE 2 NODE (with its own MongoDB and Redis)
  # ═══════════════════════════════════════════════════════════════════════
  
  # Slave 2's local MongoDB
  slave2-mongodb:
    image: mongo:7.0
    command: mongod --bind_ip_all
    volumes:
      - slave2-mongodb:/data/db
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Slave 2's local Redis
  slave2-redis:
    image: redis:7-alpine
    volumes:
      - slave2-redis:/data
    networks:
      - distrisearch-ap
    restart: unless-stopped

  # Slave 2 node
  slave-2:
    image: distrisearch/slave:latest
    environment:
      # Node identity
      - NODE_ID=slave-2
      - NODE_ROLE=slave
      - CLUSTER_ID=distrisearch-ap-cluster
      # AP Mode
      # Local MongoDB (THIS node's documents)
      - LOCAL_MONGODB_URI=mongodb://slave2-mongodb:27017
      - MONGODB_URI=mongodb://slave2-mongodb:27017/distrisearch_slave2
      # Local Redis
      - REDIS_URL=redis://slave2-redis:6379
      # Master connection
      - MASTER_HOST=master
      - MASTER_PORT=8001
      # Raft peers
      - RAFT_PEERS=master-1,slave-1,slave-2
      # API
      - API_PORT=8000
      - NODE_ADDRESS=slave-2
      # Replication
      - REPLICATION_FACTOR=2
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - slave2-sqlite:/app/data/sqlite
      - slave2-raft:/app/data/raft
      - slave2-docs:/app/data/documents
    ports:
      - "8081:80"
      - "8002:8000"
    networks:
      - distrisearch-ap
    depends_on:
      - master
      - slave2-mongodb
      - slave2-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # LOAD BALANCER (Optional - for unified access)
  # ═══════════════════════════════════════════════════════════════════════
  load-balancer:
    build:
      context: ./load-balancer
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - distrisearch-ap
    depends_on:
      - slave-1
      - slave-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
