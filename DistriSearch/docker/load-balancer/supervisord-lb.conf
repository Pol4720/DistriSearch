[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.stdout.log
stderr_logfile=/var/log/supervisor/nginx.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:upstream-updater]
command=/usr/local/bin/update-upstreams.sh
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/upstream-updater.stdout.log
stderr_logfile=/var/log/supervisor/upstream-updater.stderr.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
environment=MASTER_HOST="%(ENV_MASTER_HOST)s",MASTER_PORT="%(ENV_MASTER_PORT)s",UPDATE_INTERVAL="%(ENV_UPDATE_INTERVAL)s"

[group:loadbalancer]
programs=nginx,upstream-updater
priority=999
