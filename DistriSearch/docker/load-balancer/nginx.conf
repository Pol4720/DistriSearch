# DistriSearch Nginx Load Balancer - Dynamic Configuration
# Configuración dinámica para funcionar con N nodos sin prefijar slaves
# Usa resolver DNS de Docker (127.0.0.11) para descubrimiento dinámico

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ═══════════════════════════════════════════════════════════════════════
    # RESOLVER DNS - Clave para descubrimiento dinámico
    # 127.0.0.11 es el DNS interno de Docker
    # valid=10s significa que re-resuelve cada 10 segundos
    # ═══════════════════════════════════════════════════════════════════════
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ═══════════════════════════════════════════════════════════════════════
    # UPSTREAMS DINÁMICOS
    # Los upstreams se incluyen desde archivos generados dinámicamente
    # En modo HA, el script update-upstreams.sh genera master_api dinámicamente
    # ═══════════════════════════════════════════════════════════════════════
    include /etc/nginx/conf.d/upstreams/*.conf;

    # Upstream por defecto para master (fallback cuando no hay configuración dinámica)
    # En modo HA, el script update-upstreams.sh genera master_api dinámicamente
    # Este fallback solo se usa si no hay configuración dinámica disponible
    upstream master_api_fallback {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Health check endpoint server (internal)
    server {
        listen 8080;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # SERVIDOR PRINCIPAL HTTP
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name distrisearch.local *.distrisearch.local localhost _;

        # Variables para resolución dinámica de backends
        set $slave_api_backend "slave_api";
        set $slave_frontend_backend "slave_frontend";
        # En modo HA, master_api upstream es generado dinámicamente por update-upstreams.sh
        set $master_backend "master_api";

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ═══════════════════════════════════════════════════════════════════
        # API - Proxy a slaves (backend)
        # ═══════════════════════════════════════════════════════════════════
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://$slave_api_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Node-ID $upstream_addr;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Upload endpoint with special limits
        location /api/v1/documents/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            limit_conn conn_limit 10;

            client_max_body_size 500M;
            
            proxy_pass http://$slave_api_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            proxy_request_buffering off;
            
            # CORS headers for uploads from external devices
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ═══════════════════════════════════════════════════════════════════
        # MASTER API - Para coordinación interna
        # ═══════════════════════════════════════════════════════════════════
        location /master/ {
            # Solo permitir acceso de red interna
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://$master_backend/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ═══════════════════════════════════════════════════════════════════
        # WEBSOCKET - Para actualizaciones en tiempo real
        # ═══════════════════════════════════════════════════════════════════
        location /ws/ {
            proxy_pass http://$slave_api_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # ═══════════════════════════════════════════════════════════════════
        # FRONTEND - Archivos estáticos React
        # ═══════════════════════════════════════════════════════════════════
        location / {
            proxy_pass http://$slave_frontend_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 1m;
            
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
