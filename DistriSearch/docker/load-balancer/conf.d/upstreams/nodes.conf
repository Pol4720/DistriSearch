# Upstream generado automáticamente
# Usa nombres DNS internos de Docker (red overlay)

# API endpoints - todos los nodos en la red overlay
upstream node_api {
    least_conn;
    # Nombres DNS internos de Docker - puerto interno 8000
    server node-1:8000;
    server node-2:8000;
    server node-3:8000;
    keepalive 16;
}

# Frontend endpoints - puerto interno 80
upstream node_frontend {
    least_conn;
    server node-1:80;
    server node-2:80;
    server node-3:80;
    keepalive 8;
}

# Para compatibilidad con configuración existente
upstream master_api {
    least_conn;
    server node-1:8000;
    server node-2:8000;
    server node-3:8000;
    keepalive 16;
}

upstream slave_api {
    least_conn;
    server node-1:8000;
    server node-2:8000;
    server node-3:8000;
    keepalive 16;
}

upstream slave_frontend {
    least_conn;
    server node-1:80;
    server node-2:80;
    server node-3:80;
    keepalive 8;
}
