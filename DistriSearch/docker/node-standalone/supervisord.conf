; ============================================================================
; DistriSearch Standalone Node - Supervisor Configuration
; ============================================================================
; Este archivo configura supervisor para gestionar TODOS los servicios:
; - MongoDB (base de datos)
; - Redis (cache)
; - Backend (FastAPI)
; - Frontend (Nginx)
; ============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
user=root

; ============================================================================
; MongoDB - Base de datos local
; ============================================================================
[program:mongodb]
command=/usr/bin/mongod --config /etc/mongod.conf
user=mongodb
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mongodb-stdout.log
stderr_logfile=/var/log/supervisor/mongodb-stderr.log
startretries=5
startsecs=5

; ============================================================================
; Redis - Cache local
; ============================================================================
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/redis-stdout.log
stderr_logfile=/var/log/supervisor/redis-stderr.log
startretries=5
startsecs=3

; ============================================================================
; Backend - FastAPI Application
; ============================================================================
[program:backend]
command=/opt/venv/bin/python -m uvicorn backend.app.main:app --host 0.0.0.0 --port %(ENV_API_PORT)s --workers 2
directory=/app
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/backend-stdout.log
stderr_logfile=/var/log/supervisor/backend-stderr.log
startretries=10
startsecs=10
; Esperar a que MongoDB y Redis estén listos
depends_on=mongodb,redis
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    NODE_ID="%(ENV_NODE_ID)s",
    NODE_ROLE="%(ENV_NODE_ROLE)s",
    MONGODB_URI="%(ENV_MONGODB_URI)s",
    MONGODB_DATABASE="%(ENV_MONGODB_DATABASE)s",
    REDIS_URL="%(ENV_REDIS_URL)s",
    LOCAL_REDIS_URL="%(ENV_LOCAL_REDIS_URL)s",
    COORDINATOR_REDIS_URL="%(ENV_COORDINATOR_REDIS_URL)s",
    JWT_SECRET="%(ENV_JWT_SECRET)s",
    BULLY_ENABLED="%(ENV_BULLY_ENABLED)s",
    BULLY_PEERS="%(ENV_BULLY_PEERS)s",
    NODE_ADDRESS="%(ENV_NODE_ADDRESS)s",
    CLUSTER_ID="%(ENV_CLUSTER_ID)s",
    API_PORT="%(ENV_API_PORT)s"

; ============================================================================
; Frontend - Nginx serving React app
; ============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
startretries=5
startsecs=2
